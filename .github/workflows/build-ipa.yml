name: Build unsigned IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Patch SwiftSnmpKit iOS deployment target
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/darrellroot/SwiftSnmpKit.git Vendor/SwiftSnmpKit
          python3 - <<'PYCODE'
          from pathlib import Path
          manifest = Path('Vendor/SwiftSnmpKit/Package.swift')
          text = manifest.read_text()
          old = '.macOS(.v10_15)'
          assert old in text, 'Unexpected SwiftSnmpKit manifest'
          manifest.write_text(text.replace(old, '.iOS(.v13), .macOS(.v10_15)', 1))
          project = Path('project.yml')
          text = project.read_text()
          old = 'url: https://github.com/darrellroot/SwiftSnmpKit.git\n    branch: main'
          assert old in text, 'Unexpected XcodeGen package declaration'
          project.write_text(text.replace(old, 'path: Vendor/SwiftSnmpKit', 1))
          PYCODE
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build iOS app without code signing
        run: |
          set -o pipefail
          xcodebuild -project NetPulse.xcodeproj -scheme NetPulse -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA
        run: |
          set -e
          APP="build/Build/Products/Release-iphoneos/NetPulse.app"
          test -d "$APP"
          mkdir -p packaging/Payload
          ditto "$APP" packaging/Payload/NetPulse.app
          cd packaging
          zip -qr ../NetPulse-0.0.4-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: NetPulse-unsigned-IPA
          path: NetPulse-0.0.4-unsigned.ipa
          if-no-files-found: error
