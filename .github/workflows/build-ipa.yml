name: Build unsigned IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Fix SwiftSnmpKit iOS compatibility
        run: |
          git clone --depth 1 https://github.com/darrellroot/SwiftSnmpKit.git Vendor/SwiftSnmpKit
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("Vendor/SwiftSnmpKit/Package.swift")
          source = manifest.read_text()
          source = source.replace(
              ".macOS(.v10_15)",
              ".iOS(.v13), .macOS(.v10_15)"
          )
          manifest.write_text(source)

          project = Path("project.yml")
          source = project.read_text()
          source = source.replace(
              "url: https://github.com/darrellroot/SwiftSnmpKit.git\n    branch: main",
              "path: Vendor/SwiftSnmpKit"
          )
          project.write_text(source)
          PY
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build iOS app without code signing
        run: |
          set -o pipefail
          xcodebuild -project NetPulse.xcodeproj -scheme NetPulse -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA
        run: |
          set -e
          APP="build/Build/Products/Release-iphoneos/NetPulse.app"
          test -d "$APP"
          mkdir -p packaging/Payload
          ditto "$APP" packaging/Payload/NetPulse.app
          cd packaging
          zip -qr ../NetPulse-0.0.3-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: NetPulse-unsigned-IPA
          path: NetPulse-0.0.3-unsigned.ipa
          if-no-files-found: error

